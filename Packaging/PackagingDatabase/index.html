<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../homepage.css">
    <title>Packaging Database</title>

</head>
<body>

  <!-- horní lišta -->
  <div class="topbar">
    <div class="wrap">
      <div class="wordmark">Schaeffler Frenštát pod Radhoštěm<small>Supply&nbsp;Chain</small></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-meta">Interní portál</div>
    </div>
  </div>

  <!-- nadpis stránky -->
  <div class="page-head">
    <div class="wrap">
      <a class="btn-back" href="../../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M11 18l-6-6 6-6"/>
        </svg>
        Zpět na rozcestník
      </a>
      <h1>Databáze obalů</h1>
      <p>Vyber, zda chceš prohlížet již vytvořené záznamy, nebo záznamy přidávat/upravovat.</p>
    </div>
  </div>

  <!-- dlaždice -->
  <main>
    <div class="wrap">
      <div class="section-head">
        <h2>Rozcestník</h2>
        <span class="count" id="appCount"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>SCM Reporting · interní použití</span>
      <span id="year"></span>
    </div>
  </footer>

  <!-- PŘIHLAŠOVACÍ DIALOG -->
  <dialog id="authDlg" class="auth-dlg">
    <h3 id="authTitle">Přihlášení</h3>
    <label>Uživatel
      <input id="authUser" type="text" autocomplete="username">
    </label>
    <label>Heslo
      <input id="authPass" type="password" autocomplete="current-password">
    </label>
    <p id="authErr" class="auth-err" hidden>Nesprávné jméno nebo heslo.</p>
    <div class="auth-actions">
      <button id="authCancel" type="button">Zrušit</button>
      <button id="authOk" type="button" class="primary">Přihlásit</button>
    </div>
  </dialog>

  <script>
  /* ============================================================
     SEZNAM APLIKACÍ
       name   – název na dlaždici
       tag    – kategorie (malý zelený nadpis)
       desc   – popis
       url    – kam tlačítko vede
       icon   – "box" | "chart" | "table" | "truck" | "cog"
       soon   – true = dlaždice "Připravujeme" (nejde kliknout)
       auth   – { user, pass } = dlaždice vyžaduje přihlášení
     ============================================================ */
  const APPS = [
    {
      name: "Prohlížení záznamů",
      tag:  "Reporting",
      desc: "V této sekci nalezneš všechny doposud vytvořené záznamy v tabulkové formě s možností exportu do Excelu a zobrazení PSDS dokumentu.",
      url:  "/pckpoolreport/",
      icon: "box"
    },
    {
      name: "Přidávání / úprava záznamů",
      tag:  "Vývoj obalů",
      desc: "Přehled obalových konceptů s odkazy na PSDS.",
      url:  "/pckpoolreport/edit/",          // ← cíl PO přihlášení
      icon: "table",
      auth: { user: "scm_editor", pass: "ZmenMe123" }   // ← uprav
    }
  ];

  /* ---- ikony ---- */
  const ICONS = {
    box:   '<path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    table: '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M3 14h18M9 4v16"/>',
    truck: '<path d="M3 6h11v9H3zM14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/>',
    cog:   '<circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'
  };
  const ARROW = '<path d="M5 12h14M13 6l6 6-6 6"/>';

  function iconSvg(key) {
    const body = ICONS[key] || ICONS.box;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
         + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }

  /* ---- JEDNA jediná funkce tileHtml ---- */
  function tileHtml(app, index) {
    const inner =
      '<div class="tile-icon">' + iconSvg(app.icon) + '</div>' +
      '<div class="tile-eyebrow">' + (app.tag || '') + '</div>' +
      '<h3 class="tile-name">' + app.name + '</h3>' +
      '<p class="tile-desc">' + app.desc + '</p>' +
      (app.auth ? '<p class="tile-note">Vyžaduje přihlášení</p>' : '');

    if (app.soon) {
      return '<div class="tile tile-soon">' +
             '<span class="badge-soon">Připravujeme</span>' + inner + '</div>';
    }

    const href  = app.auth ? '#' : app.url;
    const attr  = app.auth ? ' data-auth="' + index + '"' : '';
    const label = app.auth ? 'Přihlásit se' : 'Otevřít';

    return '<a class="tile" href="' + href + '"' + attr + ' aria-label="Otevřít – ' + app.name + '">' +
           inner +
           '<span class="tile-go">' + label +
           '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ARROW + '</svg>' +
           '</span></a>';
  }

  /* ---- vykreslení ---- */
  const grid = document.getElementById("grid");
  grid.innerHTML = APPS.map(tileHtml).join("");

  const live = APPS.filter(a => !a.soon).length;
  document.getElementById("appCount").textContent =
    live + (live === 1 ? " aktivní odkazy" : live <= 4 ? " aktivní odkazy" : " aktivních odkazy");

  document.getElementById("year").textContent = new Date().getFullYear();

  /* ---- přihlašovací logika ---- */
  const dlg      = document.getElementById("authDlg");
  const inpUser  = document.getElementById("authUser");
  const inpPass  = document.getElementById("authPass");
  const errBox   = document.getElementById("authErr");
  let pendingApp = null;

  grid.addEventListener("click", function (e) {
    const tile = e.target.closest("[data-auth]");
    if (!tile) return;
    e.preventDefault();

    pendingApp = APPS[Number(tile.dataset.auth)];
    document.getElementById("authTitle").textContent = "Přihlášení – " + pendingApp.name;
    inpUser.value = "";
    inpPass.value = "";
    errBox.hidden = true;
    dlg.showModal();
    inpUser.focus();
  });

  document.getElementById("authCancel").addEventListener("click", function () {
    dlg.close();
  });

  document.getElementById("authOk").addEventListener("click", function () {
    if (!pendingApp) return;
    const okUser = inpUser.value.trim() === pendingApp.auth.user;
    const okPass = inpPass.value === pendingApp.auth.pass;

    if (okUser && okPass) {
      dlg.close();
      window.location.href = pendingApp.url;   // přesměrování po přihlášení
    } else {
      errBox.hidden = false;
      inpPass.value = "";
      inpPass.focus();
    }
  });

  dlg.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("authOk").click();
    }
  });
  </script>

</body>
</html>
