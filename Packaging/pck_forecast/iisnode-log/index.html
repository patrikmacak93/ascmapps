<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"FSAS00025VMA-11808-stderr-1783409278880.txt","computername":"FSAS00025VMA","pid":11808,"type":"stderr","created":1783409278880},{"file":"FSAS00025VMA-11808-stdout-1783409278879.txt","computername":"FSAS00025VMA","pid":11808,"type":"stdout","created":1783409278879},{"file":"FSAS00025VMA-5484-stderr-1783413032498.txt","computername":"FSAS00025VMA","pid":5484,"type":"stderr","created":1783413032498},{"file":"FSAS00025VMA-5484-stdout-1783413032498.txt","computername":"FSAS00025VMA","pid":5484,"type":"stdout","created":1783413032498},{"file":"FSAS00025VMA-9852-stderr-1783411208154.txt","computername":"FSAS00025VMA","pid":9852,"type":"stderr","created":1783411208154},{"file":"FSAS00025VMA-9852-stdout-1783411208154.txt","computername":"FSAS00025VMA","pid":9852,"type":"stdout","created":1783411208154}];
        var lastUpdated = 1783413032762;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
