<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="homepage.css">
<title>SCM Reporting – rozcestník</title>
</head>

<body>

  <!-- horní lišta -->
  <div class="topbar">
    <div class="wrap">
      <div class="wordmark">Schaeffler Frenštát pod Radhoštěm<small>Supply&nbsp;Chain</small></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-meta">Interní portál</div>
    </div>
  </div>

  <!-- nadpis stránky (bez baneru) -->
  <div class="page-head">
    <div class="wrap">
      <h1>SCM Interní aplikace</h1>
      <p>Rozcestník interních aplikací dodavatelského řetězce.</p>
    </div>
  </div>

  <!-- dlaždice -->
  <main>
    <div class="wrap">
      <div class="section-head">
        <h2>Aplikace</h2>
        <span class="count" id="appCount"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>SCM Reporting · interní použití</span>
      <span id="year"></span>
    </div>
  </footer>

<script>
  /* ============================================================
     SEZNAM APLIKACÍ
     Přidání nové appky = jeden objekt do pole níže.
       name   – název na dlaždici
       tag    – kategorie (malý zelený nadpis)
       desc   – jednořádkový popis
       url    – kam tlačítko vede (uprav dle nasazení na IIS)
       icon   – klíč ikony: "box" | "chart" | "table" | "truck" | "cog"
       soon   – true = dlaždice "Připravujeme" (nejde kliknout)
     ============================================================ */
  const APPS = [
    {
      name: "Packaging Forecast",
      tag:  "Řízení obalů",
      desc: "Zůstatky poolu (PckPoolBalance), simulace poolu, potřeby materiálu a obalů, Pareto přehledy.",
      url:  "/packagingForecast/",            // ← uprav podle reálné cesty na serveru
      icon: "box"
    },

    // --- příklady připravovaných dlaždic – nahraď nebo smaž ---
    {
      name: "Databáze dodavatelských obalů",
      tag:  "Vývoj obalů",
      desc: "Přehled obalových konceptů s odkazy na PSDS",
      url:  "/packagingDatabase/",            // ← uprav podle reálné cesty na serveru (IIS aplikace)
      icon: "table",
      soon: false
    },
    {
      name: "Expedice PNZ",
      tag:  "Expedice",
      desc: "Vyhledání PNZ v IMT dle naskenované etikety nebo materiálového čísla.",
      url:  "/outboundPnz/",
      icon: "truck"
    }
  ];

  /* ---- ikony (jednoduché linkové SVG, bez značkové grafiky) ---- */
  const ICONS = {
    box:   '<path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    table: '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M3 14h18M9 4v16"/>',
    truck: '<path d="M3 6h11v9H3zM14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/>',
    cog:   '<circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'
  };
  const ARROW = '<path d="M5 12h14M13 6l6 6-6 6"/>';

  function iconSvg(key) {
    const body = ICONS[key] || ICONS.box;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
         + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }

  function tileHtml(app) {
    const inner =
      '<div class="tile-icon">' + iconSvg(app.icon) + '</div>' +
      '<div class="tile-eyebrow">' + app.tag + '</div>' +
      '<h3 class="tile-name">' + app.name + '</h3>' +
      '<p class="tile-desc">' + app.desc + '</p>';

    if (app.soon) {
      return '<div class="tile tile-soon">' +
             '<span class="badge-soon">Připravujeme</span>' + inner + '</div>';
    }
    return '<a class="tile" href="' + app.url + '" aria-label="Otevřít – ' + app.name + '">' +
           inner +
           '<span class="tile-go">Otevřít' +
           '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ARROW + '</svg>' +
           '</span></a>';
  }

  const grid = document.getElementById("grid");
  grid.innerHTML = APPS.map(tileHtml).join("");

  const live = APPS.filter(a => !a.soon).length;
  document.getElementById("appCount").textContent =
    live + (live === 1 ? " aktivní aplikace" : live >= 2 && live <= 4 ? " aktivní aplikace" : " aktivních aplikací");

  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
